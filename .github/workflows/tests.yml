name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: silt
          POSTGRES_USER: silt
          POSTGRES_PASSWORD: silt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U silt -d silt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r frontend/requirements.txt
          pip install -r requirements-dev.txt

      # The sandbox image is the isolation boundary. Building it here means the
      # security tests that attack it run in CI instead of being skipped.
      - name: Build the sandbox image
        run: ./backend/app/sandbox/build.sh

      - name: Run tests (SQLite)
        run: pytest -v

      - name: Run tests (Postgres)
        env:
          TEST_DATABASE_URL: postgresql://silt:silt@localhost:5432/silt
        run: pytest -v

      # The agent regression suite: scripted model (no API key, no cost), real
      # graph, real code execution in the Docker sandbox. Fails the build when
      # any case fails.
      - name: Agent evaluation suite (offline)
        working-directory: backend
        env:
          SANDBOX_BACKEND: docker
        run: python -m app.evals run --no-store --markdown eval-report.md

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: backend/eval-report.md
          if-no-files-found: ignore
