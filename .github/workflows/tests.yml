name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: silt
          POSTGRES_USER: silt
          POSTGRES_PASSWORD: silt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U silt -d silt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r frontend/requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests (SQLite)
        run: pytest -v

      - name: Run tests (Postgres)
        env:
          TEST_DATABASE_URL: postgresql://silt:silt@localhost:5432/silt
        run: pytest -v
