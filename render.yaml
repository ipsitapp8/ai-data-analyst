# Render Blueprint. Connect this repo on Render (New > Blueprint) and it
# reads this file automatically.
#
# Free plan has an EPHEMERAL disk: app.db, uploads, and workspaces are wiped
# on every deploy and on every idle spin-down/restart. That's a deliberate
# tradeoff for a free/testing deployment -- add a persistent disk (needs a
# paid plan) under this service if you want data to survive restarts:
#   disk:
#     name: data
#     mountPath: /app/data
#     sizeGB: 1
#
# GEMINI_API_KEY, LLAMA_API_KEY, and APP_PASSWORD are marked sync: false --
# Render will prompt for them in the dashboard on first deploy rather than
# storing them in this file. JWT_SECRET_KEY is auto-generated by Render.
services:
  - type: web
    name: ai-data-analyst
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: LLAMA_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
