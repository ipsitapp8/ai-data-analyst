# Render Blueprint. Connect this repo on Render (New > Blueprint) and it
# reads this file automatically.
#
# The database is managed Postgres (below), not the app's local disk -- so
# uploads/workspaces are still ephemeral on the free plan's disk (wiped on
# deploy/idle spin-down), but the actual data (datasets, questions, dashboards,
# audit trail) survives, since it now lives in Postgres rather than a SQLite
# file on that disk. Add a persistent disk under this service only if you also
# want uploaded CSVs/sandbox workspaces to survive restarts:
#   disk:
#     name: data
#     mountPath: /app/data
#     sizeGB: 1
#
# GEMINI_API_KEY, LLAMA_API_KEY, APP_PASSWORD, and the SMTP_* vars are marked
# sync: false -- Render will prompt for them in the dashboard on first deploy
# rather than storing them in this file. JWT_SECRET_KEY is auto-generated by
# Render. SMTP_USER/SMTP_PASSWORD can be left blank in the dashboard prompt if
# you don't want invite emails sent -- everything else still works without them.
services:
  - type: web
    name: ai-data-analyst
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: LLAMA_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ai-data-analyst-db
          property: connectionString

databases:
  - name: ai-data-analyst-db
    plan: free
    databaseName: silt
    user: silt

  # Next.js marketing site. Separate service from the Docker app above: it
  # deploys on its own cadence and its build doesn't touch the Python image.
  # NEXT_PUBLIC_APP_URL is where every "Launch app" CTA points -- set it to the
  # ai-data-analyst service's URL in the Render dashboard.
  - type: web
    name: datasage-web
    env: node
    rootDir: web
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_APP_URL
        sync: false
